name: Prepare a self-install release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/release-check.mjs --publication
        env:
          GH_TOKEN: ${{ github.token }}
  checks:
    needs: decisions
    uses: ./.github/workflows/ci.yml
  draft:
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: artifacts
      - name: Create a draft for owner review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --notes-file docs/RELEASE_NOTES.md artifacts/watch-it-*.zip artifacts/checksums.txt artifacts/image-id.txt artifacts/docker-smoke.json artifacts/setup-smoke.json artifacts/container-audit.json
